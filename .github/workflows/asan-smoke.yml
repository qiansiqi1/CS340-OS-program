name: ASan smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang-18
      SYMBOLIZER: llvm-symbolizer-18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install compiler, ASan runtime, and symbolizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libclang-rt-18-dev llvm-18
      - name: Build and verify safe and overflow cases
        run: bash scripts/run_smoke.sh
      - name: Print evidence in the Actions log
        if: always()
        run: |
          for log in results/latest/environment.txt results/latest/build.log results/latest/safe.log results/latest/overflow.log results/latest/summary.txt; do
            if [ -f "$log" ]; then
              printf '\n=== %s ===\n' "$log"
              cat "$log"
            fi
          done
      - name: Save raw text evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asan-smoke-${{ github.sha }}
          path: results/latest/
          if-no-files-found: warn
          retention-days: 30

  redzone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CC: clang-18
      SYMBOLIZER: llvm-symbolizer-18
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install compiler, ASan runtime, and symbolizer
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libclang-rt-18-dev llvm-18
      - name: Run heap redzone experiment
        run: bash scripts/run_redzone.sh
      - name: Print experiment summary
        if: always()
        run: |
          for log in results/redzone/environment.txt results/redzone/build.log results/redzone/summary.txt results/redzone/trials.tsv; do
            if [ -f "$log" ]; then
              printf '\n=== %s ===\n' "$log"
              cat "$log"
            fi
          done
      - name: Save experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asan-redzone-${{ github.sha }}
          path: results/redzone/
          if-no-files-found: warn
          retention-days: 30
